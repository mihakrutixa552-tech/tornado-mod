name: Build Tornado Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and patch project
        run: |
          unzip -o tornado-mod.zip
          sed -i 's/this.setInvulnerable(true);/\/\/ invulnerable/g' src/main/java/net/tornadomod/TornadoEntity.java
          sed -i 's/e.hurtMarked = true;/e.needsSync = true;/g' src/main/java/net/tornadomod/TornadoEntity.java
          chmod +x gradlew || true
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build with Gradle
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tornado-mod-jar
          path: build/libs/*.jar
          
